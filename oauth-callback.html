<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oura Authorization - Personal Health Hub</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:760px;margin:60px auto;padding:0 20px;line-height:1.6;color:#1f2937}.box{padding:16px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;word-break:break-all}button{padding:10px 14px;font-size:16px}</style></head>
<body>
<h1>Oura authorization received</h1>
<p>This page does not transmit your authorization code anywhere. Copy the code below and paste it into the Personal Health Hub notebook when prompted.</p>
<div class="box" id="code">Looking for authorization code…</div>
<p><button id="copy">Copy code</button></p>
<p id="status"></p>
<script>
const q=new URLSearchParams(window.location.search);
const code=q.get("code");
const err=q.get("error");
const box=document.getElementById("code");
if(code){box.textContent=code;}else if(err){box.textContent="Authorization error: "+err;}else{box.textContent="No authorization code was found in the URL.";}
document.getElementById("copy").onclick=async()=>{if(!code)return;await navigator.clipboard.writeText(code);document.getElementById("status").textContent="Copied.";}
</script>
</body></html>
